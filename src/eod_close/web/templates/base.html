<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Indicator styles off: htmx would inject an inline <style>, which the
     Content-Security-Policy blocks; the equivalent rules are in app.css.
     "style" is left out of the attributes htmx carries across a swap, for
     the same reason: copying one is an inline style the policy blocks.
     "class" is left out too: carrying it would leave swapped rows wearing
     their old classes for a moment (htmx's settle step), long enough for a
     test, or a quick reader, to see no matched rows. The site has no class
     transitions that would need it. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "attributesToSettle": ["width", "height"]}'>
  <title>{% block title %}End-of-Day Close{% endblock %}</title>
  {# Preloaded so the first paint already uses the self-hosted fonts. #}
  <link rel="preload" href="/static/fonts/public-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/marcellus-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <script src="{{ static_url('vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ static_url('app.js') }}" defer></script>
  <script src="{{ static_url('game.js') }}" defer></script>
</head>
<body{% block body_attrs %}{% endblock %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header-inner">
      {# The logo: a round rubber stamp with a tick, drawn inline so it takes
         the theme's stamp green. #}
      <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="10.6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.6 1.6"/><path d="M10.6 16.4l3.7 3.7 7.3-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>End-of-Day Close</a>
      {# Training also covers the pages of a day in progress (/play/...). #}
      {% set path = request.url.path %}
      {% set sections = [
        ("/", "Reconcile", path == "/" or path.startswith("/day")),
        ("/training", "Training mode", path.startswith("/training") or path.startswith("/play")),
        ("/how-it-works", "How it works", path.startswith("/how-it-works")),
      ] %}
      <nav aria-label="Main">
        <ul>
          {% for href, name, current in sections %}
          <li><a href="{{ href }}"{% if current %} aria-current="page"{% endif %}>{{ name }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
    <p class="notice" role="note">All data here is fictional. This is a portfolio project, not real financial software.</p>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>End-of-Day Close: a payment reconciliation tool for operations analysts. Fictional data only. <a href="/docs">API documentation</a></p>
  </footer>
</body>
</html>
