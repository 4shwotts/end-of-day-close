<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Indicator styles off: htmx would inject an inline <style>, which the
     Content-Security-Policy blocks; the equivalent rules are in app.css.
     "style" is left out of the attributes htmx carries across a swap, for
     the same reason: copying one is an inline style the policy blocks. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "attributesToSettle": ["class", "width", "height"]}'>
  <title>{% block title %}End-of-Day Close{% endblock %}</title>
  {# Preloaded so the first paint already uses the self-hosted font. #}
  <link rel="preload" href="/static/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <script src="{{ static_url('vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ static_url('app.js') }}" defer></script>
  <script src="{{ static_url('game.js') }}" defer></script>
</head>
<body{% block body_attrs %}{% endblock %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">£</span> End-of-Day Close</a>
      {# Training also covers the pages of a day in progress (/play/...). #}
      {% set path = request.url.path %}
      {% set sections = [
        ("/", "Reconcile", path == "/" or path.startswith("/sample")),
        ("/training", "Training mode", path.startswith("/training") or path.startswith("/play")),
        ("/how-it-works", "How it works", path.startswith("/how-it-works")),
      ] %}
      <nav aria-label="Main">
        <ul>
          {% for href, name, current in sections %}
          <li><a href="{{ href }}"{% if current %} aria-current="page"{% endif %}>{{ name }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
    <p class="notice" role="note">All data here is fictional. This is a portfolio project, not real financial software.</p>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>End-of-Day Close: a payment reconciliation tool for operations analysts. Fictional data only. <a href="/docs">API documentation</a></p>
  </footer>
</body>
</html>
